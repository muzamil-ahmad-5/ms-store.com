version: '3.8'

services:
  # Production PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mscollection_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mscollection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MSCollectionSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-mscollection_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mscollection} -d ${POSTGRES_DB:-mscollection_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mscollection_network

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mscollection_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mscollection}:${POSTGRES_PASSWORD:-MSCollectionSecure2026!}@postgres:5432/${POSTGRES_DB:-mscollection_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-MS_COLLECTION_ULTRA_SECURE_JWT_KEY_2026_PRODUCTION}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports:
      - "5000:5000"
    networks:
      - mscollection_network

  # Frontend Storefront (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mscollection_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - mscollection_network

volumes:
  postgres_data:
    driver: local

networks:
  mscollection_network:
    driver: bridge
